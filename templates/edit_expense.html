{% extends "base.html" %}

{% block title %}Edit Expense - Personal Expense Tracker{% endblock %}

{% block content %}
<div class="form-container-wrapper">
    <div class="form-card">
        <div class="form-card-header expense-theme-header">
            <div class="header-icon">✏️💳</div>
            <div class="header-texts">
                <h2>Edit Expense Record</h2>
                <p>Update transaction #{{ item.id }}</p>
            </div>
        </div>

        <form action="{{ url_for('edit_expense', expense_id=item.id) }}" method="POST" class="standard-form">
            <!-- Amount -->
            <div class="form-group">
                <label for="amount" class="form-label">Amount (₹) <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">₹</span>
                    <input 
                        type="number" 
                        step="0.01" 
                        min="0.01" 
                        id="amount" 
                        name="amount" 
                        class="form-control" 
                        value="{{ item.amount }}" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description" class="form-label">Description <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">📝</span>
                    <input 
                        type="text" 
                        id="description" 
                        name="description" 
                        class="form-control" 
                        value="{{ item.description }}" 
                        maxlength="255" 
                        required
                    >
                </div>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="category" class="form-label">Category <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">🏷️</span>
                    <select id="category" name="category" class="form-control" required>
                        {% for cat in expense_categories %}
                            <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>
                                {{ cat }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Date -->
            <div class="form-group">
                <label for="date" class="form-label">Date <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">📅</span>
                    <input 
                        type="date" 
                        id="date" 
                        name="date" 
                        class="form-control" 
                        value="{{ item.date.strftime('%Y-%m-%d') if item.date is not string else item.date }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-card-actions">
                <a href="{{ url_for('transactions') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger btn-lg">
                    💾 Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
